<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Union Estudiantine et Scolaire Minignan – Cotisations</title>
<style>
:root{--ink:#1f2933;--bg:#eef1f4;--card:#fff;--line:#d9dee4;--accent:#2a7a2e;--ok:#17724a;--okbg:#e3f4ea;--late:#b42318;--latebg:#fde8e6}
*{box-sizing:border-box}
body{margin:0;font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg)}
#app{max-width:880px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
h1{font-size:1.4rem;margin:0}h2{font-size:1.1rem;margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:16px}
.auth{max-width:420px;margin:8vh auto 0}
label{display:block;font-size:.9rem;font-weight:600;margin-bottom:12px}
input,select{display:block;width:100%;margin-top:4px;padding:10px;font:inherit;border:1px solid var(--line);border-radius:6px;background:#fff}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{background:var(--accent);color:#fff;border:0;border-radius:6px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer}
.btn.sm{padding:6px 10px;font-size:.85rem}.btn:disabled{opacity:.5}
.link{background:none;border:0;color:var(--accent);font:inherit;cursor:pointer;text-decoration:underline;padding:4px}
.err{color:var(--late);min-height:1.4em;margin:0 0 8px;font-size:.9rem}
.statut{display:flex;justify-content:space-between;align-items:center}
.statut p{margin:0;text-transform:capitalize}.statut strong{font-size:1.5rem}
.statut.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.statut.late{background:var(--latebg);border-color:var(--late);color:var(--late)}
.bar{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:.85rem;color:#52606d}
small{display:block;color:#52606d}
.pill{padding:2px 10px;border-radius:99px;font-size:.85rem;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--okbg);color:var(--ok)}.pill.late{background:var(--latebg);color:var(--late)}
.vide{color:#52606d;text-align:center}
.brand{display:flex;align-items:center;gap:10px}.brand img{width:52px;height:52px;object-fit:contain}
.auth img{display:block;width:150px;margin:0 auto 8px}.auth h1{text-align:center;font-size:1.15rem}
@media(max-width:480px){.row{grid-template-columns:1fr}}
</style>
</head>

const MONTANT = 200, DEVISE = "FCFA";

const auth = getAuth(initializeApp(firebaseConfig));
const db = getFirestore();
const $ = s => document.querySelector(s);
const app = $("#app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const d = new Date();
const moisCourant = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
const fmtMois = m => new Date(m + "-01").toLocaleDateString("fr-FR", { month: "long", year: "numeric" });
const erreur = e => ({
  "auth/email-already-in-use": "Cet e-mail est déjà utilisé.",
  "auth/invalid-credential": "E-mail ou mot de passe incorrect.",
  "auth/weak-password": "Mot de passe trop court (6 caractères minimum).",
  "auth/too-many-requests": "Trop de tentatives. Réessaie dans quelques minutes."
}[e.code] || "Une erreur est survenue. Réessaie.");

let me = null, profile = null;

function shell(html, titre = "Mes cotisations") {
  app.innerHTML = `<header><div class="brand"><img src="${LOGO}" alt="Logo"><h1>${titre}</h1></div><div>${esc(profile?.prenom)} ${esc(profile?.nom)}
    <button class="link" id="out">Se déconnecter</button></div></header>${html}`;
  $("#out").onclick = () => signOut(auth);
}

/* ---------- Connexion / inscription ---------- */
function vueAuth(inscription = false) {
  app.innerHTML = `<section class="card auth"><img src="${LOGO}" alt="Logo de l'association"><h1>Union Estudiantine et Scolaire Minignan</h1><br>
  <form id="f">
    ${inscription ? `<div class="row"><label>Nom<input name="nom" required></label>
      <label>Prénom<input name="prenom" required></label></div>
      <label>Filière<input name="filiere" required></label>
      <label>Téléphone<input name="telephone" type="tel" required></label>` : ""}
    <label>E-mail<input name="email" type="email" required autocomplete="email"></label>
    <label>Mot de passe<input name="mdp" type="password" minlength="6" required
      autocomplete="${inscription ? "new-password" : "current-password"}"></label>
    <p class="err" id="err" role="alert"></p>
    <button class="btn">${inscription ? "Créer mon compte" : "Se connecter"}</button>
  </form><br>
  <button class="link" id="sw">${inscription ? "J'ai déjà un compte" : "Créer un compte"}</button></section>`;
  $("#sw").onclick = () => vueAuth(!inscription);
  $("#f").onsubmit = async e => {
    e.preventDefault();
    const v = Object.fromEntries(new FormData(e.target));
    try {
      if (inscription) {
        const c = await createUserWithEmailAndPassword(auth, v.email, v.mdp);
        await setDoc(doc(db, "users", c.user.uid), {
          nom: v.nom.trim(), prenom: v.prenom.trim(), filiere: v.filiere.trim(),
          telephone: v.telephone.trim(), email: v.email, createdAt: serverTimestamp()
        });
        await charger(c.user);
      } else await signInWithEmailAndPassword(auth, v.email, v.mdp);
    } catch (x) { $("#err").textContent = erreur(x); }
  };
}

/* ---------- Espace membre ---------- */
async function vueMembre() {
  shell("<p>Chargement…</p>");
  const s = await getDocs(query(collection(db, "payments"), where("uid", "==", me.uid)));
  const ps = s.docs.map(x => x.data()).sort((a, b) => b.month.localeCompare(a.month));
  const ok = ps.some(p => p.month === moisCourant);
  shell(`<section class="card statut ${ok ? "ok" : "late"}">
      <p>${fmtMois(moisCourant)}</p><strong>${ok ? "À jour" : "En retard"}</strong></section>
    <section class="card"><h2>Historique des paiements</h2>
    ${ps.length ? `<div class="scroll"><table><thead><tr><th>Mois</th><th>Montant</th><th>Validé le</th></tr></thead><tbody>
      ${ps.map(p => `<tr><td>${fmtMois(p.month)}</td><td>${esc(p.amount)} ${DEVISE}</td>
      <td>${p.validatedAt ? p.validatedAt.toDate().toLocaleDateString("fr-FR") : "—"}</td></tr>`).join("")}
      </tbody></table></div>` : `<p class="vide">Aucun paiement enregistré pour le moment.</p>`}</section>`);
}

/* ---------- Espace trésorier ---------- */
async function vueAdmin(m = moisCourant) {
  shell("<p>Chargement…</p>", "Espace trésorier");
  const [us, ps] = await Promise.all([
    getDocs(collection(db, "users")),
    getDocs(query(collection(db, "payments"), where("month", "==", m)))
  ]);
  const payes = new Set(ps.docs.map(x => x.data().uid));
  const membres = us.docs.map(x => ({ id: x.id, ...x.data(), ok: payes.has(x.id) }))
    .sort((a, b) => a.nom.localeCompare(b.nom));

  shell(`<section class="card">
    <div class="bar">
      <label>Mois<input type="month" id="m" value="${m}"></label>
      <label>Recherche<input id="q" placeholder="Nom, prénom ou filière"></label>
      <label>Statut<select id="s"><option value="">Tous</option>
        <option value="late">En retard</option><option value="ok">À jour</option></select></label>
    </div>
    <p id="bilan"></p>
    <div class="scroll"><table><thead><tr><th>Membre</th><th>Filière</th><th>Statut</th><th></th></tr></thead>
    <tbody id="tb"></tbody></table></div></section>`, "Espace trésorier");

  const maj = () => {
    const q = $("#q").value.trim().toLowerCase(), s = $("#s").value;
    const l = membres.filter(x => `${x.nom} ${x.prenom} ${x.filiere}`.toLowerCase().includes(q)
      && (!s || (s === "ok") === x.ok));
    $("#bilan").textContent = `${membres.filter(x => x.ok).length} / ${membres.length} membres à jour en ${fmtMois(m)}`;
    $("#tb").innerHTML = l.map(x => `<tr>
      <td>${esc(x.prenom)} ${esc(x.nom)}<small>${esc(x.telephone)}</small></td>
      <td>${esc(x.filiere)}</td>
      <td><span class="pill ${x.ok ? "ok" : "late"}">${x.ok ? "À jour" : "En retard"}</span></td>
      <td>${x.ok ? "" : `<button class="btn sm" data-id="${esc(x.id)}">Valider le paiement</button>`}</td></tr>`).join("")
      || `<tr><td colspan="4" class="vide">Aucun membre ne correspond.</td></tr>`;
  };
  maj();
  $("#q").oninput = $("#s").onchange = maj;
  $("#m").onchange = e => vueAdmin(e.target.value || moisCourant);
  $("#tb").onclick = async e => {
    const id = e.target.dataset.id;
    if (!id) return;
    e.target.disabled = true;
    await setDoc(doc(db, "payments", `${id}_${m}`), {
      uid: id, month: m, amount: MONTANT, validatedBy: me.uid, validatedAt: serverTimestamp()
    });
    membres.find(x => x.id === id).ok = true;
    maj();
  };
}

/* ---------- Démarrage ---------- */
async function charger(u) {
  me = u;
  const [p, a] = await Promise.all([getDoc(doc(db, "users", u.uid)), getDoc(doc(db, "admins", u.uid))]);
  profile = p.exists() ? p.data() : null;
  a.exists() ? vueAdmin() : vueMembre();
}
onAuthStateChanged(auth, u => u ? charger(u) : vueAuth());
</script>
